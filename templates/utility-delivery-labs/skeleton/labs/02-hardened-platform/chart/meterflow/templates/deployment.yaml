apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "meterflow.name" . }}
  labels:
    {{- include "meterflow.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "meterflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "meterflow.selectorLabels" . | nindent 8 }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "meterflow.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        {{- include "meterflow.podSecurityContext" . | nindent 8 }}
      {{- if .Values.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: {{ .Values.topologySpread.zoneKey }}
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "meterflow.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "meterflow.selectorLabels" . | nindent 14 }}
      {{- end }}
      containers:
        - name: headend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- include "meterflow.containerSecurityContext" . | nindent 12 }}
          ports:
            - name: api
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: METER_COUNT
              value: {{ .Values.meterflow.meterCount | quote }}
            - name: INTERVAL
              value: {{ .Values.meterflow.interval | quote }}
            - name: MAX_AGE
              value: {{ .Values.meterflow.maxAge | quote }}
            - name: DRAIN_DELAY
              value: {{ .Values.meterflow.drainDelay | quote }}
            {{- if .Values.tls.enabled }}
            - name: TLS_CERT_FILE
              value: /etc/meterflow/tls/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/meterflow/tls/tls.key
            {{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 2
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: /etc/meterflow/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
        {{- if .Values.tls.enabled }}
        - name: tls
          secret:
            secretName: {{ include "meterflow.name" . }}-tls
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
