apiVersion: v1
kind: Service
metadata:
  name: {{ include "meterflow.name" . }}
  labels:
    {{- include "meterflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "meterflow.selectorLabels" . | nindent 4 }}
  ports:
    - name: api
      port: 8080
      targetPort: api
    - name: metrics
      port: 9090
      targetPort: metrics
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "meterflow.name" . }}
  labels:
    {{- include "meterflow.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if and .Values.podDisruptionBudget.enabled (gt (int .Values.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "meterflow.name" . }}
  labels:
    {{- include "meterflow.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "meterflow.selectorLabels" . | nindent 6 }}
{{- end }}
