# Git write-back and GHCR read credentials for Argo CD Image Updater, from Vault.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: image-updater-creds
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault
  target:
    name: image-updater-creds
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        username: "{{ .gitUser }}"
        password: "{{ .gitToken }}"
        ghcr: "{{ .ghcrUser }}:{{ .ghcrToken }}"
  data:
    - secretKey: gitUser
      remoteRef:
        key: argocd/image-updater
        property: GIT_USERNAME
    - secretKey: gitToken
      remoteRef:
        key: argocd/image-updater
        property: GIT_TOKEN
    - secretKey: ghcrUser
      remoteRef:
        key: ghcr/pull
        property: GHCR_USERNAME
    - secretKey: ghcrToken
      remoteRef:
        key: ghcr/pull
        property: GHCR_TOKEN
