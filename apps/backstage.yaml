apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: "2.10.2"
    helm:
      valuesObject:
        backstage:
          args:
            - --config
            - app-config.yaml
          image:
            registry: ghcr.io
            repository: praveenbhatk8s/backstage
            tag: sha256:d6fb2e36881981ea10ebbf2b455fa089e340ee992ba375e05ac30cc557b01f01
            pullPolicy: IfNotPresent
          initContainers:
            - name: wait-for-postgres
              image: postgres:17
              command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
          extraEnvVarsSecrets:
            - postgres-credentials
          extraEnvVars:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          appConfig:
            app:
              baseUrl: http://backstage.localhost
            backend:
              baseUrl: http://backstage.localhost
              cors:
                origin: http://backstage.localhost
              database:
                client: pg
                connection:
                  host: ${POSTGRES_HOST}
                  port: ${POSTGRES_PORT}
                  user: ${POSTGRES_USER}
                  password: ${POSTGRES_PASSWORD}
            auth:
              providers:
                guest:
                  dangerouslyAllowOutsideDevelopment: true
            catalog:
              locations:
                - type: file
                  target: ./examples/entities.yaml
                - type: file
                  target: ./examples/template/template.yaml
                  rules:
                    - allow: [Template]
                - type: file
                  target: ./examples/org.yaml
                  rules:
                    - allow: [User, Group]
        ingress:
          enabled: true
          className: traefik
          host: backstage.localhost
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true