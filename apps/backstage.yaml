apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://backstage.github.io/charts
    chart: backstage
    targetRevision: "2.10.2"
    helm:
      valuesObject:
        backstage:
          args:
            - --config
            - app-config.yaml
          image:
            registry: ghcr.io
            repository: praveenbhatk8s/backstage
            tag: sha-f617282
            pullPolicy: IfNotPresent
          initContainers:
            - name: wait-for-postgres
              image: postgres:17
              command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
          extraEnvVarsSecrets:
            - postgres-credentials
            - backstage-github
            - backstage-argocd
          extraEnvVars:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          appConfig:
            app:
              baseUrl: http://backstage.localhost
            backend:
              baseUrl: http://backstage.localhost
              cors:
                origin: http://backstage.localhost
              database:
                client: pg
                connection:
                  host: ${POSTGRES_HOST}
                  port: ${POSTGRES_PORT}
                  user: ${POSTGRES_USER}
                  password: ${POSTGRES_PASSWORD}
            auth:
              environment: development
              providers:
                guest:
                  dangerouslyAllowOutsideDevelopment: true
                github:
                  development:
                    clientId: ${AUTH_GITHUB_CLIENT_ID}
                    clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
                    signIn:
                      resolvers:
                        - resolver: usernameMatchingUserEntityName
            catalog:
              locations:
                - type: file
                  target: ./examples/entities.yaml
                - type: file
                  target: ./examples/template/template.yaml
                  rules:
                    - allow: [Template]
                - type: file
                  target: ./examples/org.yaml
                  rules:
                    - allow: [User, Group]
                - type: url
                  target: https://github.com/praveenbhatk8s/homelab/blob/main/templates/go-service/template.yaml
                  rules:
                    - allow: [Template]
            kubernetes:
              serviceLocatorMethod:
                type: multiTenant
              clusterLocatorMethods:
                - type: config
                  clusters:
                    - name: homelab
                      url: https://kubernetes.default.svc
                      authProvider: serviceAccount
                      caFile: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            argocd:
              localDevelopment: true
              appLocatorMethods:
                - type: config
                  instances:
                    - name: homelab
                      url: http://argocd-server.argocd.svc
                      token: ${ARGOCD_AUTH_TOKEN}
        ingress:
          enabled: true
          className: traefik
          host: backstage.localhost
        serviceAccount:
          create: true
          name: backstage
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true