apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backstage-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/praveenbhatk8s/homelab
    targetRevision: main
    path: manifests/backstage-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: backstage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true