apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    targetRevision: "9.5.11"
    helm:
      releaseName: argocd
      valuesObject:
        global:
          domain: argocd.localhost
        server:
          ingress:
            enabled: true
            ingressClassName: traefik
        configs:
          params:
            server.insecure: true
          cm:
            accounts.backstage: apiKey
          rbac:
            policy.csv: |
              g, backstage, role:readonly
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    syncOptions:
      - ServerSideApply=true